<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mit personlige API</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css"
        integrity="sha512-EZLkOqwILORob+p0BXZc+Vm3RgJBOe1Iq/0fiI7r/wJgzOFZMlsqTa29UEl6v6U6gsV4uIpsNZoV32YZqrCRCQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="api_lib/myApiStyles.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.15.2/mqtt.min.js"

<body>
    <div id="toast"></div>
    <div id="timer">0 sek</div>
    <main>
        <div class="page show" id="page1">
            <h1>Mit personlige API</h1>
            <div id="buttonContainer">
                <div class="visible" id="buttonIdle"></div>
                <div class="hidden" id="buttonPressed"></div>
            </div>
            <h1>Tryk og gå til page2 og start timer</h1>
        </div>

        <div class="page" id="page2">
            <h1>Stadig mit personlige API</h1>
            <div id="cards">
                <div class="container"></div>
            </div>
            <div id="buttonContainer">
                <div class="visible" id="buttonIdle"></div>
                <div class="hidden" id="buttonPressed"></div>
            </div>
            <h1>Tryk og gå til page1 og sluk timer</h1>
        </div>

    </main>
    <script src="/api_lib/myApi.js"></script>
    <script src="./index.js"></script>

</html>
