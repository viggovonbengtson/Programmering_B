<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web template with p5.js</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css"
        integrity="sha512-EZLkOqwILORob+p0BXZc+Vm3RgJBOe1Iq/0fiI7r/wJgzOFZMlsqTa29UEl6v6U6gsV4uIpsNZoV32YZqrCRCQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="tracker.css">
        <script src="./api_lib/myClasses.js"></script>
        <script src="./api_lib/myApi.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
        <script src="https://api.gazerecorder.com/GazeCloudAPI.js" ></script>
</head>

<body>
    <div class="menu-wrapper">
        <div class="burger-icon">≡</div>
        <div class="sidebar">
        </div>
    </div>
    <main> 
        
        <div class="page show" id="page1" title="page1">
            <h1>hellow</h1>
            <button id="btnUp">↑</button>
            <span>
                <button id="btnLeft">←</button>
                <button id="btnDown">↓</button>
                <button id="btnRight">→</button>
            </span>
        </div>

<div class="page" id="page2" title="page2">
    <h1>GazeCloudAPI integration example</h1>
    <button type="button" onclick="GazeCloudAPI.StartEyeTracking();">Start</button>
    <button type="button" onclick="GazeCloudAPI.StopEyeTracking();">Stop</button>
    <p id="GazeData"></p>
    <p id="HeadPhoseData"></p>
    <p id="HeadRotData"></p>
</div>

<div id="gaze" style="position:absolute; display:none; width:100px; height:100px; border-radius:50%; border:solid 2px rgba(255,255,255,.2); box-shadow:0 0 100px 3px rgba(125,125,125,.5); pointer-events:none; z-index:999999"></div>

    </main>
    <script src="./tracker.js"></script>
</body>

</html>
